apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ruby-278
resources:
  - namespace.yaml
  - configmap.yaml
  - infra.yaml
  - apps.yaml
  - jobs.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: echo-nginx
    files:
      - nginx-echo.conf
images:
  - name: ruby-278-app
    newName: ruby-278-app
    newTag: latest
