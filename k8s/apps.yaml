apiVersion: apps/v1
kind: Deployment
metadata:
  name: rails
  namespace: ruby-278
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rails
  template:
    metadata:
      labels:
        app: rails
    spec:
      containers:
        - name: rails
          image: ruby-278-app:latest
          imagePullPolicy: IfNotPresent
          args: ["rails-server"]
          envFrom:
            - configMapRef:
                name: app-env
          ports:
            - containerPort: 3000
          resources:
            requests:
              memory: 256Mi
              cpu: 50m
            limits:
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: 3000
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: rails
  namespace: ruby-278
spec:
  selector:
    app: rails
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sinatra
  namespace: ruby-278
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sinatra
  template:
    metadata:
      labels:
        app: sinatra
    spec:
      containers:
        - name: sinatra
          image: ruby-278-app:latest
          imagePullPolicy: IfNotPresent
          args: ["bundle", "exec", "ruby", "sinatra/app.rb"]
          envFrom:
            - configMapRef:
                name: app-env
          env:
            - name: PORT
              value: "4567"
          ports:
            - containerPort: 4567
          resources:
            requests:
              memory: 128Mi
              cpu: 25m
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 4567
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: sinatra
  namespace: ruby-278
spec:
  selector:
    app: sinatra
  ports:
    - port: 4567
      targetPort: 4567
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sidekiq
  namespace: ruby-278
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sidekiq
  template:
    metadata:
      labels:
        app: sidekiq
    spec:
      containers:
        - name: sidekiq
          image: ruby-278-app:latest
          imagePullPolicy: IfNotPresent
          args: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
          envFrom:
            - configMapRef:
                name: app-env
          resources:
            requests:
              memory: 192Mi
              cpu: 25m
            limits:
              memory: 384Mi
