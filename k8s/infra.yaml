apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: ruby-278
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          env:
            - name: POSTGRES_USER
              value: otel
            - name: POSTGRES_PASSWORD
              value: otel
            - name: POSTGRES_DB
              value: otel_production
          ports:
            - containerPort: 5432
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 256Mi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "otel", "-d", "otel_production"]
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: ruby-278
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: ruby-278
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          args:
            - --character-set-server=utf8mb4
            - --innodb-buffer-pool-size=64M
            - --performance-schema=OFF
            # Trilogy cannot do caching_sha2_password over plain TCP.
            - --default-authentication-plugin=mysql_native_password
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: otel
            - name: MYSQL_USER
              value: otel
            - name: MYSQL_PASSWORD
              value: otel
            - name: MYSQL_DATABASE
              value: otel
          ports:
            - containerPort: 3306
          resources:
            requests:
              memory: 256Mi
              cpu: 50m
            limits:
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "127.0.0.1", "-uotel", "-potel"]
            initialDelaySeconds: 15
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: ruby-278
spec:
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306
---
