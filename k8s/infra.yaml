apiVersion: apps/v1
kind: Deployment
metadata:
  name: redpanda
  namespace: ruby-278
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redpanda
  template:
    metadata:
      labels:
        app: redpanda
    spec:
      containers:
        - name: redpanda
          image: docker.redpanda.com/redpandadata/redpanda:v23.3.18
          args:
            - redpanda
            - start
            - --mode=dev-container
            - --smp=1
            - --memory=512M
            - --overprovisioned
            - --kafka-addr=internal://0.0.0.0:9092
            - --advertise-kafka-addr=internal://redpanda:9092
            - --rpc-addr=0.0.0.0:33145
            - --advertise-rpc-addr=redpanda:33145
            - --default-log-level=warn
          ports:
            - containerPort: 9092
          resources:
            requests:
              memory: 256Mi
              cpu: 50m
            limits:
              memory: 768Mi
          readinessProbe:
            exec:
              command: ["rpk", "cluster", "health"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: redpanda
  namespace: ruby-278
spec:
  selector:
    app: redpanda
  ports:
    - port: 9092
      targetPort: 9092
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: localstack
  namespace: ruby-278
spec:
  replicas: 1
  selector:
    matchLabels:
      app: localstack
  template:
    metadata:
      labels:
        app: localstack
    spec:
      containers:
        - name: localstack
          image: localstack/localstack:3.4
          env:
            - name: SERVICES
              value: s3
            - name: GATEWAY_LISTEN
              value: 0.0.0.0:4566
            - name: EAGER_SERVICE_LOADING
              value: "1"
          ports:
            - containerPort: 4566
          resources:
            requests:
              memory: 256Mi
              cpu: 50m
            limits:
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /_localstack/health
              port: 4566
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: localstack
  namespace: ruby-278
spec:
  selector:
    app: localstack
  ports:
    - port: 4566
      targetPort: 4566
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo
  namespace: ruby-278
spec:
  replicas: 1
  selector:
    matchLabels:
      app: echo
  template:
    metadata:
      labels:
        app: echo
    spec:
      containers:
        - name: nginx
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx-echo.conf
          resources:
            requests:
              memory: 16Mi
              cpu: 10m
            limits:
              memory: 32Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 5
      volumes:
        - name: nginx-conf
          configMap:
            name: echo-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: echo
  namespace: ruby-278
spec:
  selector:
    app: echo
  ports:
    - port: 80
      targetPort: 80
