default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>

development:
  <<: *default
  url: <%= ENV.fetch("DATABASE_URL", "postgres://localhost:5432/otel_ruby_development") %>

test:
  <<: *default
  url: <%= ENV.fetch("DATABASE_URL", "postgres://localhost:5432/otel_ruby_test") %>

production:
  <<: *default
  url: <%= ENV.fetch("DATABASE_URL", "postgres://otel:otel@postgres:5432/otel_production") %>
